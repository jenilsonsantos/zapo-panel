<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Ublochat</title><link rel="stylesheet" href="/style.css"></head>
<body class="auth-page"><main class="auth-card"><img src="/assets/zapo-header.png" alt="Ublochat" class="auth-logo"><h1>Acessar painel</h1><p>Use as credenciais do administrador ou da sua empresa.</p><form id="login"><label>E-mail<input type="email" name="email" required autocomplete="email"></label><label>Senha<input type="password" name="password" required autocomplete="current-password"></label><button>Entrar com segurança</button><p id="error" class="auth-error" aria-live="polite"></p></form></main><script>
document.querySelector('#login').addEventListener('submit', async (event) => { event.preventDefault(); const form = new FormData(event.currentTarget); const response = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.fromEntries(form)) }); if (response.ok) location.href='/'; else document.querySelector('#error').textContent=(await response.json()).error || 'Não foi possível entrar.' })
</script><p class="auth-switch">Ainda não tem uma conta? <a href="/cadastro">Criar conta</a></p></body></html>
