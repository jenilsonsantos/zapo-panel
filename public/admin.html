<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração · Ublochat</title><link rel="stylesheet" href="/style.css"></head>
<body class="admin-page"><main class="admin-wrap"><header class="admin-header"><div><img src="/assets/zapo-header.png" alt="Ublochat" class="auth-logo"><h1>Administração</h1><p>Empresas e acessos do sistema.</p></div><div><a href="/" class="admin-link">Painel</a><button id="logout">Sair</button></div></header><section class="admin-grid"><form id="tenant-form" class="admin-card"><h2>Nova empresa</h2><label>Nome da empresa<input name="name" required maxlength="120"></label><label>Slug (ex.: minha-empresa)<input name="slug" required pattern="[a-z0-9-]{3,80}"></label><label>Nome do administrador<input name="adminName" required maxlength="120"></label><label>E-mail do administrador<input type="email" name="email" required></label><label>Senha inicial (mínimo 14 caracteres)<input type="password" name="password" minlength="14" required></label><button>Criar empresa</button><p id="message" class="auth-error" aria-live="polite"></p></form><section class="admin-card"><h2>Empresas cadastradas</h2><div id="tenants">Carregando…</div></section></section></main><script src="/admin.js"></script></body></html>
