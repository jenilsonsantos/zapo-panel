<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração · Ublochat</title><link rel="stylesheet" href="/style.css"></head>
<body class="admin-login-page"><main class="admin-login-card"><span class="admin-badge">ÁREA RESTRITA</span><img src="/assets/zapo-header.png" alt="Ublochat" class="auth-logo"><h1>Administração</h1><p>Este acesso é exclusivo para o superadministrador do sistema.</p><form id="admin-login"><label>E-mail administrativo<input type="email" name="email" required autocomplete="email"></label><label>Senha<input type="password" name="password" required autocomplete="current-password"></label><button>Entrar no backoffice</button><p id="error" class="auth-error" aria-live="polite"></p></form><a class="back-link" href="/login">Voltar ao login do painel</a></main><script>
document.querySelector('#admin-login').addEventListener('submit', async (event) => { event.preventDefault(); const response = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.fromEntries(new FormData(event.currentTarget))) }); if (response.ok) location.href='/admin'; else document.querySelector('#error').textContent=(await response.json()).error || 'Acesso negado.' })
</script></body></html>
