<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta · Ublochat</title><link rel="stylesheet" href="/style.css"></head>
<body class="auth-page"><main class="auth-card"><img src="/assets/zapo-header.png" alt="Ublochat" class="auth-logo"><h1>Criar sua conta</h1><p>Você será o administrador da sua empresa.</p><form id="register"><label>Seu nome<input name="name" required maxlength="120" autocomplete="name"></label><label>Nome da empresa<input name="company" required maxlength="120" autocomplete="organization"></label><label>Identificador da empresa<input name="slug" required pattern="[a-z0-9-]{3,80}" placeholder="minha-empresa" autocomplete="off"><small>Use letras minúsculas, números e hífen.</small></label><label>E-mail<input type="email" name="email" required autocomplete="email"></label><label>Senha<input type="password" name="password" minlength="14" required autocomplete="new-password"><small>Use no mínimo 14 caracteres.</small></label><button>Criar conta</button><p id="error" class="auth-error" aria-live="polite"></p></form><p class="auth-switch">Já tem uma conta? <a href="/login">Entrar</a></p></main><script>
document.querySelector('#register').addEventListener('submit', async (event) => { event.preventDefault(); const form = new FormData(event.currentTarget); const response = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.fromEntries(form)) }); if (response.ok) location.href='/'; else document.querySelector('#error').textContent=(await response.json()).error || 'Não foi possível criar a conta.' })
</script></body></html>
