<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta · Ublochat</title><link rel="stylesheet" href="/auth.css"></head>
<body class="auth-shell"><main class="auth-layout"><section class="auth-intro"><a href="/" class="auth-brand"><img src="/assets/zapo-header.png" alt="Ublochat"></a><span class="auth-pill">COMECE AGORA</span><h1>Sua operação,<br><em>do seu jeito.</em></h1><p>Crie o ambiente da sua empresa e comece a centralizar o atendimento.</p><div class="auth-points"><span>✓ Empresa isolada</span><span>✓ Conta de administrador</span><span>✓ Configuração rápida</span></div></section><section class="auth-panel"><div class="auth-card auth-card-wide"><p class="auth-eyebrow">NOVA EMPRESA</p><h2>Crie sua conta</h2><p class="auth-copy">Você será o administrador inicial da sua empresa.</p><form id="register"><label>Seu nome<input name="name" required maxlength="120" autocomplete="name" placeholder="Seu nome"></label><label>Nome da empresa<input name="company" required maxlength="120" autocomplete="organization" placeholder="Nome da empresa"></label><label>Identificador da empresa<input name="slug" required pattern="[a-z0-9-]{3,80}" placeholder="minha-empresa" autocomplete="off"><small>Use letras minúsculas, números e hífen.</small></label><label>E-mail<input type="email" name="email" required autocomplete="email" placeholder="voce@empresa.com"></label><label>Senha<input type="password" name="password" minlength="14" required autocomplete="new-password" placeholder="Mínimo de 14 caracteres"><small>Escolha uma senha forte com pelo menos 14 caracteres.</small></label><button>Criar minha empresa <span>→</span></button><p id="error" class="auth-error" aria-live="polite"></p></form><p class="auth-switch">Já tem uma conta? <a href="/login">Entrar</a></p></div></section></main><script>
document.querySelector('#register').addEventListener('submit', async (event) => { event.preventDefault(); const response = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.fromEntries(new FormData(event.currentTarget))) }); if (response.ok) location.href='/'; else document.querySelector('#error').textContent=(await response.json()).error || 'Não foi possível criar a conta.' })
</script></body></html>
